apiVersion: apps/v1
kind: Deployment
metadata: { name: devopscanvas-control-plane }
spec:
  replicas: 2
  selector: { matchLabels: { app: devopscanvas-control-plane } }
  template:
    metadata: { labels: { app: devopscanvas-control-plane } }
    spec:
      containers:
        - name: api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports: [ { containerPort: 3000 } ]
          readinessProbe: { httpGet: { path: /healthz, port: 3000 } }
          livenessProbe:  { httpGet: { path: /healthz, port: 3000 } }
