image:
  repository: ghcr.io/DevOpsCanvasIO/devopscanvas-control-plane
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 3000
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.devopscanvas.DevOpsCanvasIO.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: control-plane-tls
      hosts:
        - api.devopscanvas.DevOpsCanvasIO.dev

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

env:
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://devopscanvas:password@postgres:5432/devopscanvas
  GITHUB_ORG: DevOpsCanvasIO

healthCheck:
  enabled: true
  path: /healthz
  port: 3000

readinessProbe:
  httpGet:
    path: /ready
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 30

# PostgreSQL dependency
postgresql:
  enabled: true
  auth:
    postgresPassword: password
    username: devopscanvas
    password: password
    database: devopscanvas
  primary:
    persistence:
      enabled: true
      size: 10Gi